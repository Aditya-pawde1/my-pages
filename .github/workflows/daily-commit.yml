name: Daily Auto Commit

on:
  schedule:
    - cron: '17 4 * * *'   # Runs daily at 04:17 UTC (specific time, no wildcards)
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "23f2005561@ds.study.iitm.ac.in"

      - name: 23f2005561@ds.study.iitm.ac.in - Create Daily Commit
        run: |
          echo "Last updated: $(date)" >> daily-log.txt
          git add daily-log.txt
          git commit -m "Daily automated commit"
          git push
