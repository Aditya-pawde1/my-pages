name: Cache Workflow

on:
  workflow_dispatch:

jobs:
  test-cache:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: echo "hello" > test.txt

      - id: cache
        uses: actions/cache@v4
        with:
          path: test.txt
          key: cache-98f36df

      - name: prime-cache-98f36df
        run: echo "Cache hit: ${{ steps.cache.outputs.cache-hit }}"
