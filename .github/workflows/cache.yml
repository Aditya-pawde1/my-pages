name: CI with Cache

on: [push]  # Triggers on any push to your repo

jobs:
  build:
    runs-on: ubuntu-latest  # Free Linux runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Grabs your repo files
      
    - name: prime-cache-98f36df  # Exact step name they want
      id: cache-step
      uses: actions/cache@v4     # Latest cache action
      with:
        key: cache-98f36df       # Exact key they specified
        path: ~/.npm             # Caches Node.js deps (common example; works even without package.json)
        
    - name: Cache hit/miss result
      run: echo "Cache result: ${{ steps.cache-step.outputs.cache-hit }}"

