name: Cache Workflow

on:
  workflow_dispatch:

jobs:
  cache-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache directory
        run: |
          mkdir -p ~/.cache/demo
          echo "demo-data" > ~/.cache/demo/file.txt

      - name: Cache dependencies
        id: cache-demo
        uses: actions/cache@v4
        with:
          path: ~/.cache/demo
          key: cache-98f36df

      - name: prime-cache-98f36df
        run: echo "Cache hit: ${{ steps.cache-demo.outputs.cache-hit }}"
