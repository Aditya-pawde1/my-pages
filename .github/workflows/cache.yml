name: Cache Workflow

on:
  workflow_dispatch:

jobs:
  cache-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create file
        run: |
          mkdir cache-dir
          echo hello > cache-dir/file.txt

      - name: Cache step
        id: cache-step
        uses: actions/cache@v4
        with:
          path: cache-dir
          key: cache-98f36df

      - name: prime-cache-98f36df
        run: echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"

